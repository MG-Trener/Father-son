name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --output /tmp/delete-response.txt --write-out '%{http_code}' \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/git/refs/heads/$HEAD_REF")

          if [ "$code" = "204" ] || [ "$code" = "422" ]; then
            echo "Removed or already absent: $HEAD_REF"
            exit 0
          fi

          echo "Failed to remove $HEAD_REF (HTTP $code)"
          cat /tmp/delete-response.txt
          exit 1
