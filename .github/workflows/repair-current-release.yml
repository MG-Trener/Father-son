name: Repair Current Android Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-current-release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_SUPABASE_URL: https://kyptvbnnyqlmwkiobtvq.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7d-vT92P448Prlv7DURaIw_r8127lra
  SOURCE_REPO: MG-Trener/Father-son
  RELEASES_REPO: MG-Trener/Father-son-releases

jobs:
  repair-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_RELEASE_SECRET_KEY: ${{ secrets.SUPABASE_RELEASE_SECRET_KEY }}
      RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify public release repository access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh repo view "$RELEASES_REPO" --json nameWithOwner,visibility >/dev/null
          echo "Public release repository access verified: $RELEASES_REPO"

      - name: Resolve current release
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app.json').expo.version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          TAG="android-v${VERSION_CODE}"
          ASSET="papa-i-ya-${VERSION}.apk"
          DOWNLOAD_URL="https://github.com/${RELEASES_REPO}/releases/download/${TAG}/${ASSET}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Download current APK from private source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-download
          gh release download "$TAG" --repo "$SOURCE_REPO" --pattern "$ASSET" --dir release-download
          test -s "release-download/$ASSET"

      - name: Prepare release metadata
        id: apk
        env:
          ASSET: ${{ steps.meta.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          APK="release-download/$ASSET"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c%s "$APK")"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "Recovered APK size: $SIZE_BYTES bytes"

      - name: Publish or repair public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          APK="release-download/$ASSET"
          cat > release-notes.md <<EOF
          Android-версия «Папа & Я» ${VERSION} (versionCode ${VERSION_CODE}).

          ARM64-сборка для современных Android-телефонов.
          SHA-256: ${SHA256}
          Подписано постоянным release-ключом; подходит для последующих обновлений.
          Исходный код хранится в приватном репозитории. Здесь публикуется только APK.
          Source repository: ${SOURCE_REPO}

          Канал: release.
          EOF

          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$RELEASES_REPO" --clobber
            gh release edit "$TAG" --repo "$RELEASES_REPO" \
              --title "Папа & Я ${VERSION}" \
              --notes-file release-notes.md \
              --prerelease=false \
              --latest
          else
            gh release create "$TAG" "$APK" \
              --repo "$RELEASES_REPO" \
              --target main \
              --title "Папа & Я ${VERSION}" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Publish current release metadata in Supabase
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          DOWNLOAD_URL: ${{ steps.meta.outputs.download_url }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          SIZE_BYTES: ${{ steps.apk.outputs.size_bytes }}
        run: node .github/scripts/publish-release-metadata.mjs
