name: Generate Lockfile Once

on:
  push:
    branches:
      - fix/audit-hardening-20260913
    paths:
      - 'package.json'
      - '.github/workflows/generate-lockfile-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload package lock
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-json
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
