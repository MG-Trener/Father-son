name: Preview Feature Branch

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: preview-feature-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: https://kyptvbnnyqlmwkiobtvq.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7d-vT92P448Prlv7DURaIw_r8127lra
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
  ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies and generate brand assets
        run: npm install --ignore-scripts=false

      - name: TypeScript
        run: npm run typecheck

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Build ARM64 preview APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --max-workers=2 \
            --build-cache \
            --stacktrace \
            --console=plain

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: papa-i-ya-feature-preview-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
