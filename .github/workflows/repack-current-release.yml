name: Repack Current Android Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repack-current-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_PUBLIC_SUPABASE_URL: https://kyptvbnnyqlmwkiobtvq.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7d-vT92P448Prlv7DURaIw_r8127lra
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
  ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

jobs:
  repack-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_RELEASE_SECRET_KEY: ${{ secrets.SUPABASE_RELEASE_SECRET_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --ignore-scripts=false

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript
        run: npm run typecheck

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Optimize release package size
        shell: bash
        run: |
          cat >> android/gradle.properties <<'EOF'
          android.enableMinifyInReleaseBuilds=true
          android.enableProguardInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          android.enableBundleCompression=true
          EOF
          echo "Enabled R8/ProGuard, resource shrinking and JS bundle compression for the release APK."

      - name: Configure persistent release signing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Build optimized ARM64 release APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --max-workers=2 \
            --build-cache \
            --stacktrace \
            --console=plain \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            2>&1 | tee ../gradle-repack.log

      - name: Verify signing and size
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          CERT_INFO="$($APKSIGNER verify --print-certs "$APK")"
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -qi 'Android Debug'; then
            echo "Optimized APK is debug signed; refusing to publish."
            exit 1
          fi

          VERSION="$(node -p "require('./app.json').expo.version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c%s "$APK")"
          STORAGE_PATH="android/${VERSION_CODE}/papa-i-ya-${VERSION}.apk"
          RELEASE_ASSET="papa-i-ya-${VERSION}.apk"

          echo "Optimized APK size: $SIZE_BYTES bytes"
          if [ "$SIZE_BYTES" -ge 50000000 ]; then
            echo "APK is still too large for the Supabase Free global 50 MB limit."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "storage_path=$STORAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "release_asset=$RELEASE_ASSET" >> "$GITHUB_OUTPUT"

      - name: Replace GitHub Release APK with optimized build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          RELEASE_ASSET: ${{ steps.meta.outputs.release_asset }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v${VERSION_CODE}"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "$RELEASE_ASSET"
          gh release upload "$TAG" "$RELEASE_ASSET" --clobber
          cat > release-notes.md <<EOF
          Android-версия «Папа & Я» ${VERSION} (versionCode ${VERSION_CODE}).

          Оптимизированная ARM64-сборка для современных Android-телефонов.
          SHA-256: ${SHA256}
          Подписано постоянным release-ключом; подходит для последующих обновлений.
          APK оптимизирован для канала обновлений Supabase без изменений кода приложения.

          Канал: release.
          EOF
          gh release edit "$TAG" \
            --title "Папа & Я ${VERSION}" \
            --notes-file release-notes.md \
            --prerelease=false \
            --latest

      - name: Publish optimized APK and update feed in Supabase
        env:
          APK_PATH: android/app/build/outputs/apk/release/app-release.apk
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          STORAGE_PATH: ${{ steps.meta.outputs.storage_path }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SIZE_BYTES: ${{ steps.meta.outputs.size_bytes }}
        run: node .github/scripts/publish-supabase-release.mjs

      - name: Clean signing material
        if: always()
        run: rm -f android/app/release.keystore

      - name: Upload repack log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papa-i-ya-repack-gradle-log
          path: gradle-repack.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload optimized APK artifact
        if: always() && steps.meta.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: papa-i-ya-optimized-${{ steps.meta.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
